<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#eef5f8">
    <meta name="description" content="Интерактивное закрепление и тестирование по ЕНТ">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="История Казахстана — ЕНТ тренажёр">
    <meta property="og:description" content="Интервальное заучивание и экзамен по истории Казахстана">
    <title>ЕНТ тренажёр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%237657c7'/%3E%3Cpath d='M17 18h30v28H17zM17 32h30M32 18v28' fill='none' stroke='%23fff' stroke-width='4'/%3E%3C/svg%3E">
    <style>
        :root {
            --background: #f7f5fc;
            --surface: #ffffff;
            --ink: #242033;
            --muted: #77718a;
            --line: #e5e0f0;
            --primary: #7657c7;
            --primary-dark: #50358f;
            --gold: #f5b700;
            --success: #1b8a4f;
            --success-soft: #eaf5ef;
            --error: #c8372d;
            --error-soft: #fbeeea;
            --shadow: 0 10px 30px rgba(80, 53, 143, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Manrope", sans-serif;
            color: var(--ink);
            background: var(--background);
        }

        button, select { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .app {
            width: min(600px, 100%);
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 16px 16px calc(86px + env(safe-area-inset-bottom));
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .brand {
            font-size: 17px;
            font-weight: 800;
        }

        .sound-btn {
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--primary-dark);
            cursor: pointer;
            font-weight: 800;
        }

        .subject-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .subject-btn {
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
        }

        .subject-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
        }

        .mode-btn {
            min-height: 44px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-weight: 800;
        }

        .mode-btn.active {
            background: var(--primary-dark);
            color: #fff;
        }

        .card {
            min-height: 520px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            min-height: 64px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--line);
        }

        select {
            min-width: 0;
            max-width: 100%;
            border: 0;
            background: transparent;
            color: var(--ink);
            font-size: 15px;
            font-weight: 800;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .timer {
            display: none;
            color: var(--primary-dark);
            font-size: 17px;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
        }

        .timer.visible { display: block; }
        .timer.danger { color: var(--error); }

        .quiz { padding: 24px 18px 28px; }

        .streak {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .streak span {
            height: 7px;
            border-radius: 999px;
            background: var(--line);
            transition: background 180ms ease;
        }

        .streak span.filled { background: var(--gold); }

        .topic {
            min-height: 18px;
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
        }

        .question {
            margin: 0 0 22px;
            font-size: clamp(21px, 6vw, 29px);
            line-height: 1.25;
            font-weight: 800;
        }

        .options { display: grid; gap: 10px; }

        .option {
            width: 100%;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
            color: var(--ink);
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
        }

        .option-index {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .option.correct {
            border-color: var(--success);
            background: var(--success-soft);
            color: #11643a;
        }

        .option.correct .option-index {
            border-color: var(--success);
            background: var(--success);
            color: #fff;
        }

        .option.incorrect {
            border-color: var(--error);
            background: var(--error-soft);
            color: #8d281f;
        }

        .option.incorrect .option-index {
            border-color: var(--error);
            background: var(--error);
            color: #fff;
        }

        .option.exam-selected {
            border-color: var(--primary);
            background: #edf6fa;
            color: var(--primary-dark);
        }

        .option.exam-selected .option-index {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 64px;
            margin-top: 20px;
        }

        .learning-status { color: var(--muted); font-size: 12px; font-weight: 700; }
        .navigation { display: flex; gap: 8px; margin-left: auto; }

        .back, .next, .restart {
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        .back {
            display: none;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            padding: 10px 14px;
        }

        .back.visible { display: block; }

        .next {
            display: none;
            background: var(--primary-dark);
            color: #fff;
            padding: 10px 14px;
        }

        .next.visible { display: block; }

        .finish-test {
            display: none;
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: transparent;
            color: var(--error);
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 800;
        }

        .finish-test.visible { display: block; }

        .confirm-dialog {
            width: min(360px, calc(100% - 32px));
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            color: var(--ink);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .confirm-dialog::backdrop { background: rgba(20, 15, 35, 0.48); }
        .confirm-dialog h2 { margin: 0 0 8px; font-size: 20px; }
        .confirm-dialog p { margin: 0; color: var(--muted); line-height: 1.5; }
        .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
        .confirm-actions button {
            min-height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
        }
        .confirm-cancel { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
        .confirm-submit { border: 0; background: var(--error); color: #fff; }

        .results {
            display: none;
            min-height: 520px;
            place-items: center;
            padding: 32px 18px;
            text-align: center;
        }

        .results.visible { display: grid; }
        .results-inner { width: 100%; }

        .score {
            margin: 8px 0 22px;
            font-size: 52px;
            line-height: 1;
            font-weight: 800;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 20px;
            border: 1px solid var(--line);
            border-radius: 14px;
        }

        .stat { padding: 14px 6px; border-right: 1px solid var(--line); }
        .stat:last-child { border-right: 0; }
        .stat strong { display: block; margin-bottom: 4px; font-size: 18px; }
        .stat span { color: var(--muted); font-size: 11px; }

        .restart {
            background: var(--primary-dark);
            color: #fff;
            padding: 12px 18px;
        }

        .review-list { display: grid; gap: 8px; margin: 18px 0 20px; text-align: left; }

        .review-item {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            overflow: hidden;
        }

        .review-row {
            width: 100%;
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            border: 0;
            background: transparent;
            color: var(--ink);
            padding: 10px;
            cursor: pointer;
            text-align: left;
        }

        .review-number {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: var(--muted);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
        }

        .correct-review .review-number { background: var(--success); }
        .incorrect-review .review-number { background: var(--error); }
        .unanswered-review .review-number { background: var(--muted); }
        .review-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
        .review-status { color: var(--muted); font-size: 11px; font-weight: 800; }
        .correct-review .review-status { color: var(--success); }
        .incorrect-review .review-status { color: var(--error); }
        .unanswered-review .review-status { color: var(--muted); }

        .review-detail {
            display: none;
            border-top: 1px solid var(--line);
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .review-detail.open { display: block; }
        .review-detail strong { display: block; margin-top: 8px; color: var(--primary); }

        .empty {
            min-height: 520px;
            display: grid;
            place-items: center;
            padding: 30px;
            text-align: center;
        }

        .bottom-nav {
            position: fixed;
            z-index: 20;
            left: 50%;
            bottom: 0;
            width: min(600px, 100%);
            height: calc(68px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: 1fr 1fr;
            transform: translateX(-50%);
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.96);
            padding: 8px 12px env(safe-area-inset-bottom);
        }

        .nav-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
        }

        .nav-btn.active { color: var(--primary-dark); }

        .credit {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #171323;
                --surface: #241d33;
                --ink: #f5f1ff;
                --muted: #b7aecb;
                --line: #403553;
                --primary: #a68ae8;
                --primary-dark: #8d6bd8;
                --success-soft: #18382a;
                --error-soft: #3b2422;
                --shadow: none;
            }
            .bottom-nav { background: rgba(36, 29, 51, 0.96); }
            .option.exam-selected { background: #332653; }
            .back { background: var(--surface); }
        }

        @media (max-width: 380px) {
            .app { padding-inline: 10px; }
            .subject-btn { font-size: 12px; }
            .quiz { padding-inline: 12px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="brand">ЕНТ тренажёр</div>
            <button class="sound-btn" id="soundBtn" type="button" aria-label="Звук">Звук</button>
        </header>

        <div class="subject-switch">
            <button class="subject-btn active" type="button" data-subject="История Казахстана">История Казахстана</button>
            <button class="subject-btn" type="button" data-subject="Мат. грамотность">Мат. грамотность</button>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" id="learnMode" type="button">Заучивание</button>
            <button class="mode-btn" id="examMode" type="button">Тест / Экзамен</button>
        </div>

        <section class="card" id="card">
            <div class="card-head" id="cardHead">
                <select id="lessonSelect" aria-label="Выбор урока"></select>
                <div class="meta">
                    <span id="progressText"></span>
                    <time class="timer" id="timer">60:00</time>
                </div>
            </div>

            <div class="quiz" id="quiz">
                <div class="streak" id="streak" aria-label="Прогресс заучивания">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="topic" id="topicText"></div>
                <h1 class="question" id="questionText">Загрузка вопросов...</h1>
                <div class="options" id="optionsList"></div>
                <div class="footer">
                    <div class="learning-status" id="learningStatus"></div>
                    <div class="navigation">
                        <button class="back" id="backBtn" type="button">Назад</button>
                        <button class="next" id="nextBtn" type="button">Далее</button>
                        <button class="finish-test" id="finishTestBtn" type="button">Завершить тест</button>
                    </div>
                </div>
            </div>

            <div class="results" id="results">
                <div class="results-inner">
                    <div class="topic" id="resultTitle">Результат теста</div>
                    <div class="score" id="scoreText">0%</div>
                    <div class="stats">
                        <div class="stat"><strong id="correctStat">0</strong><span>Верно</span></div>
                        <div class="stat"><strong id="incorrectStat">0</strong><span>Ошибки</span></div>
                        <div class="stat"><strong id="totalStat">0</strong><span>Всего</span></div>
                    </div>
                    <div class="review-list" id="reviewList"></div>
                    <button class="restart" id="restartBtn" type="button">Начать заново</button>
                </div>
            </div>

            <div class="empty" id="empty" style="display:none">
                <h2>Здесь скоро будут вопросы</h2>
            </div>
        </section>

        <p class="credit">Created by Мұстафа Оразалы Асланұлы</p>
    <dialog class="confirm-dialog" id="finishConfirmDialog">
        <h2>Завершить тест?</h2>
        <p id="finishConfirmText">Все неотвеченные вопросы будут считаться ошибками.</p>
        <div class="confirm-actions">
            <button class="confirm-cancel" id="cancelFinishBtn" type="button">Отмена</button>
            <button class="confirm-submit" id="confirmFinishBtn" type="button">Подтвердить</button>
        </div>
    </dialog>

    </main>

    <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="nav-btn active" id="practiceNav" type="button">Закрепление</button>
        <a class="nav-btn" id="lessonsNav" href="https://t.me/+KF7vF9u7-HUyN2Vi" target="_blank" rel="noopener noreferrer" style="display:grid;place-items:center;text-decoration:none">Уроки</a>
    </nav>

    <script>
        const TELEGRAM_GROUP_URL = "https://t.me/+KF7vF9u7-HUyN2Vi";
        const STREAK_STORAGE_KEY = "ent_streaks_v1";
        const LEARNED_STORAGE_KEY = "ent_learned_v1";
        const SOUND_STORAGE_KEY = "ent_sound_enabled";

        let questions = [];
        let currentSubject = "История Казахстана";
        let baseQuestions = [];
        let mode = "learn";
        let learningQueue = [];
        let streaks = loadJson(STREAK_STORAGE_KEY, {});
        let learned = new Set(loadJson(LEARNED_STORAGE_KEY, []));
        let examSelections = new Map();
        let displayedQuestions = new Map();
        let currentQuestion = null;
        let examIndex = 0;
        let examCorrect = 0;
        let examIncorrect = 0;
        let examAnswered = 0;
        let timerId = null;
        let remainingSeconds = 3600;
        let wrongInAttempt = false;
        let audioContext = null;
        let soundEnabled = localStorage.getItem(SOUND_STORAGE_KEY) !== "false";

        function loadJson(key, fallback) {
            try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
            catch (_) { return fallback; }
        }

        function saveJson(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function shuffled(items) {
            const copy = [...items];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function prepareDisplayedQuestion(question) {
            if (displayedQuestions.has(question.id)) {
                return displayedQuestions.get(question.id);
            }
            const paired = question.options.map((text, index) => ({
                text,
                originalIndex: index
            }));
            const shuffledOptions = shuffled(paired);
            const prepared = {
                ...question,
                options: shuffledOptions.map(item => item.text),
                answer: shuffledOptions.findIndex(
                    item => item.originalIndex === question.answer
                )
            };
            displayedQuestions.set(question.id, prepared);
            return prepared;
        }

        async function loadQuestions() {
            try {
                const response = await fetch("./questions.json");
                questions = await response.json();
                document.getElementById("lessonsNav").href = TELEGRAM_GROUP_URL;
                updateSubject(currentSubject);
            } catch (_) {
                document.getElementById("questionText").textContent = "Ошибка загрузки вопросов";
            }
        }

        function subjectOf(question) {
            return question.subject || "История Казахстана";
        }

        function updateSubject(subject) {
            currentSubject = subject;
            document.querySelectorAll(".subject-btn").forEach(button => {
                button.classList.toggle("active", button.dataset.subject === subject);
            });

            const subjectQuestions = questions.filter(question => subjectOf(question) === subject);
            const lessons = [...new Set(subjectQuestions.map(question => question.lesson).filter(Boolean))];
            const lessonSelect = document.getElementById("lessonSelect");
            lessonSelect.innerHTML = "";

            if (!lessons.length) {
                baseQuestions = [];
                showEmpty();
                return;
            }

            lessons.forEach(lesson => {
                const option = document.createElement("option");
                option.value = lesson;
                option.textContent = lesson;
                lessonSelect.appendChild(option);
            });
            changeLesson();
        }

        function changeLesson() {
            const lesson = document.getElementById("lessonSelect").value;
            baseQuestions = questions.filter(question =>
                subjectOf(question) === currentSubject && question.lesson === lesson
            );
            displayedQuestions = new Map();
            document.getElementById("empty").style.display = "none";
            document.getElementById("cardHead").style.display = "grid";
            document.getElementById("quiz").style.display = "block";
            document.getElementById("results").classList.remove("visible");
            startMode(mode);
        }

        function showEmpty() {
            document.getElementById("cardHead").style.display = "none";
            document.getElementById("quiz").style.display = "none";
            document.getElementById("results").classList.remove("visible");
            document.getElementById("empty").style.display = "grid";
        }

        function startMode(nextMode) {
            if (!baseQuestions.length) return;
            mode = nextMode;
            displayedQuestions = new Map();
            document.getElementById("learnMode").classList.toggle("active", mode === "learn");
            document.getElementById("examMode").classList.toggle("active", mode === "exam");
            document.getElementById("timer").classList.toggle("visible", mode === "exam");
            document.getElementById("streak").style.display = mode === "learn" ? "grid" : "none";
            document.getElementById("learningStatus").style.display = mode === "learn" ? "block" : "none";
            document.getElementById("finishTestBtn").classList.toggle("visible", mode === "exam");
            document.getElementById("cardHead").style.display = "grid";
            document.getElementById("quiz").style.display = "block";
            document.getElementById("results").classList.remove("visible");
            clearInterval(timerId);

            if (mode === "learn") {
                learningQueue = shuffled(baseQuestions.filter(question => !learned.has(question.id)));
                if (!learningQueue.length) {
                    showLearningFinished();
                } else {
                    showLearningQuestion();
                }
            } else {
                examIndex = 0;
                examSelections = new Map();
                remainingSeconds = 3600;
                updateTimer();
                timerId = setInterval(() => {
                    remainingSeconds--;
                    updateTimer();
                    if (remainingSeconds <= 0) finishExam(true);
                }, 1000);
                showExamQuestion();
            }
        }

        function showLearningQuestion() {
            if (!learningQueue.length) {
                showLearningFinished();
                return;
            }
            wrongInAttempt = false;
            currentQuestion = learningQueue.shift();
            renderQuestion(currentQuestion);
            updateStreak();
            document.getElementById("backBtn").classList.remove("visible");
            document.getElementById("nextBtn").classList.remove("visible");
        }

        function showLearningFinished() {
            document.getElementById("quiz").style.display = "none";
            document.getElementById("cardHead").style.display = "grid";
            document.getElementById("results").classList.add("visible");
            document.getElementById("reviewList").style.display = "none";
            document.getElementById("resultTitle").textContent = "Заучивание завершено";
            document.getElementById("scoreText").textContent = `${baseQuestions.length} / ${baseQuestions.length}`;
            document.getElementById("correctStat").textContent = baseQuestions.length;
            document.getElementById("incorrectStat").textContent = "—";
            document.getElementById("totalStat").textContent = baseQuestions.length;
        }

        function updateStreak() {
            const count = streaks[currentQuestion.id] || 0;
            document.querySelectorAll("#streak span").forEach((segment, index) => {
                segment.classList.toggle("filled", index < count);
            });
            document.getElementById("learningStatus").textContent =
                `Верных подряд: ${count} из 5`;
        }

        function renderQuestion(question) {
            question = prepareDisplayedQuestion(question);
            currentQuestion = question;
            document.getElementById("progressText").textContent =
                mode === "learn"
                    ? `Вопросов: ${learningQueue.length + 1}`
                    : `Вопрос ${examIndex + 1} из ${baseQuestions.length}`;
            document.getElementById("topicText").textContent = question.topic || "";
            document.getElementById("questionText").textContent = question.q;

            const list = document.getElementById("optionsList");
            list.innerHTML = "";
            question.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "option";
                button.innerHTML =
                    `<span class="option-index">${index + 1}</span>` +
                    `<span>${escapeHtml(option)}</span>`;
                button.addEventListener("click", () => selectOption(index, button));
                if (mode === "exam" && examSelections.get(question.id) === index) {
                    button.classList.add("exam-selected");
                }
                list.appendChild(button);
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function createAnswerSound(source) {
            const sound = new Audio(source);
            sound.preload = "auto";
            sound.load();
            return sound;
        }

        const answerSounds = {
            correct: createAnswerSound("./correct-answer.mp3"),
            wrong: createAnswerSound("./wrong-answer.mp3")
        };

        function ensureAudioContext() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioContext = new AudioCtx();
            }
            if (audioContext && audioContext.state === "suspended") audioContext.resume();
        }

        function playTone(type) {
            if (!soundEnabled) return;
            Object.values(answerSounds).forEach(sound => {
                sound.pause();
                sound.currentTime = 0;
            });
            const sound = answerSounds[type === "wrong" ? "wrong" : "correct"];
            sound.volume = 0.8;
            const playback = sound.play();
            if (playback) playback.catch(() => {});
        }

        function selectOption(selectedIndex, button) {
            if (!currentQuestion) return;

            if (mode === "learn") {
                if (button.classList.contains("correct")) return;
                if (selectedIndex === currentQuestion.answer) {
                    button.classList.add("correct");
                    Array.from(document.getElementById("optionsList").children)
                        .forEach(optionButton => optionButton.disabled = true);

                    let count = wrongInAttempt ? 0 : (streaks[currentQuestion.id] || 0) + 1;
                    streaks[currentQuestion.id] = count;
                    saveJson(STREAK_STORAGE_KEY, streaks);

                    if (count >= 5) {
                        learned.add(currentQuestion.id);
                        saveJson(LEARNED_STORAGE_KEY, [...learned]);
                        playTone("learned");
                        delete streaks[currentQuestion.id];
                        saveJson(STREAK_STORAGE_KEY, streaks);
                    } else {
                        requeueLearningQuestion();
                        playTone("correct");
                    }
                    updateStreak();
                    setTimeout(showLearningQuestion, 650);
                } else {
                    button.classList.add("incorrect");
                    button.disabled = true;
                    wrongInAttempt = true;
                    streaks[currentQuestion.id] = 0;
                    saveJson(STREAK_STORAGE_KEY, streaks);
                    updateStreak();
                    playTone("wrong");
                    if (navigator.vibrate) navigator.vibrate(60);
                }
            } else {
                examSelections.set(currentQuestion.id, selectedIndex);
                Array.from(document.getElementById("optionsList").children)
                    .forEach(optionButton => optionButton.classList.remove("exam-selected"));
                button.classList.add("exam-selected");
                document.getElementById("nextBtn").classList.add("visible");
            }
        }

        function requeueLearningQuestion() {
            const distance = randomInt(2, 5);
            learningQueue.splice(Math.min(distance, learningQueue.length), 0, currentQuestion);
        }

        function showExamQuestion() {
            if (examIndex >= baseQuestions.length) {
                finishExam(false);
                return;
            }
            currentQuestion = baseQuestions[examIndex];
            renderQuestion(currentQuestion);
            document.getElementById("nextBtn").classList.add("visible");
            document.getElementById("backBtn").classList.toggle("visible", examIndex > 0);
            document.getElementById("finishTestBtn").classList.add("visible");
        }

        function nextQuestion() {
            if (mode !== "exam") return;
            if (examIndex < baseQuestions.length - 1) {
                examIndex++;
                showExamQuestion();
            } else {
                finishExam(false);
            }
        }

        function previousQuestion() {
            if (mode === "exam" && examIndex > 0) {
                examIndex--;
                showExamQuestion();
            }
        }

        function finishExam(timedOut) {
            clearInterval(timerId);
            document.getElementById("finishTestBtn").classList.remove("visible");
            const dialog = document.getElementById("finishConfirmDialog");
            if (dialog.open) dialog.close();
            examAnswered = examSelections.size;
            examCorrect = baseQuestions.filter(question => {
                const displayed = displayedQuestions.get(question.id);
                return examSelections.get(question.id) ===
                    (displayed ? displayed.answer : question.answer);
            }).length;
            examIncorrect = examAnswered - examCorrect;

            document.getElementById("quiz").style.display = "none";
            document.getElementById("cardHead").style.display = "none";
            document.getElementById("results").classList.add("visible");
            document.getElementById("resultTitle").textContent =
                timedOut ? "Время истекло" : "Экзамен завершён";

            const percentage = baseQuestions.length
                ? Math.round((examCorrect / baseQuestions.length) * 100)
                : 0;
            const unanswered = baseQuestions.length - examAnswered;

            document.getElementById("scoreText").textContent = `${percentage}%`;
            document.getElementById("correctStat").textContent = examCorrect;
            document.getElementById("incorrectStat").textContent = examIncorrect + unanswered;
            document.getElementById("totalStat").textContent = baseQuestions.length;
            renderExamReview();
        }

        function renderExamReview() {
            const reviewList = document.getElementById("reviewList");
            reviewList.style.display = "grid";
            reviewList.innerHTML = "";

            baseQuestions.forEach((question, index) => {
                const selectedIndex = examSelections.get(question.id);
                const answeredQuestion = selectedIndex !== undefined;
                const displayed = displayedQuestions.get(question.id);
                const correct = answeredQuestion && selectedIndex ===
                    (displayed ? displayed.answer : question.answer);
                const reviewClass = !answeredQuestion
                    ? "unanswered-review"
                    : correct
                        ? "correct-review"
                        : "incorrect-review";
                const item = document.createElement("div");
                item.className = `review-item ${reviewClass}`;

                const row = document.createElement("button");
                row.type = "button";
                row.className = "review-row";
                row.innerHTML =
                    `<span class="review-number">${index + 1}</span>` +
                    `<span class="review-name">${escapeHtml(question.q)}</span>` +
                    `<span class="review-status">${correct ? "Верно" : answeredQuestion ? "Неверно" : "Без ответа"}</span>`;

                const detail = document.createElement("div");
                detail.className = "review-detail";
                detail.innerHTML =
                    `<strong>Вопрос</strong>${escapeHtml(question.q)}` +
                    `<strong>Правильный ответ</strong>${escapeHtml(
                        displayed ? displayed.options[displayed.answer] :
                        question.options[question.answer]
                    )}`;
                row.addEventListener("click", () => detail.classList.toggle("open"));
                item.append(row, detail);
                reviewList.appendChild(item);
            });
        }

        function updateTimer() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const timer = document.getElementById("timer");
            timer.textContent =
                `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
            timer.classList.toggle("danger", remainingSeconds <= 300);
        }

        function updateSoundButton() {
            document.getElementById("soundBtn").textContent = soundEnabled ? "Звук" : "Без звука";
        }

        document.querySelectorAll(".subject-btn").forEach(button => {
            button.addEventListener("click", () => updateSubject(button.dataset.subject));
        });
        document.getElementById("learnMode").addEventListener("click", () => startMode("learn"));
        document.getElementById("examMode").addEventListener("click", () => startMode("exam"));
        document.getElementById("lessonSelect").addEventListener("change", changeLesson);
        document.getElementById("nextBtn").addEventListener("click", nextQuestion);
        document.getElementById("backBtn").addEventListener("click", previousQuestion);
        document.getElementById("finishTestBtn").addEventListener("click", () => {
            if (mode !== "exam") return;
            const unanswered = baseQuestions.length - examSelections.size;
            document.getElementById("finishConfirmText").textContent =
                unanswered
                    ? `Неотвеченных вопросов: ${unanswered}. Они будут считаться ошибками.`
                    : "Все вопросы отвечены. Завершить тест?";
            document.getElementById("finishConfirmDialog").showModal();
        });
        document.getElementById("cancelFinishBtn").addEventListener("click", () => {
            document.getElementById("finishConfirmDialog").close();
        });
        document.getElementById("confirmFinishBtn").addEventListener("click", () => {
            finishExam(false);
        });
        document.getElementById("restartBtn").addEventListener("click", () => startMode(mode));
        document.getElementById("practiceNav").addEventListener("click", () => {
            document.getElementById("quiz").style.display = "block";
            document.getElementById("results").classList.remove("visible");
        });
        document.getElementById("soundBtn").addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem(SOUND_STORAGE_KEY, String(soundEnabled));
            updateSoundButton();
            if (soundEnabled) playTone("correct");
        });

        document.addEventListener("pointerdown", ensureAudioContext, { once: true });
        updateSoundButton();
        loadQuestions();
    </script>
</body>
</html>
